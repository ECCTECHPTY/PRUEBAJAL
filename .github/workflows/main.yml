name: Compilar Cargador OpenKM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configurar NuGet
        uses: nuget/setup-nuget@v2

      - name: Restaurar paquetes NuGet (PdfSharp, Serilog, etc.)
        run: nuget restore NewCargaOpenKmCedulacion.sln

      - name: Compilar en modo Release
        run: msbuild NewCargaOpenKmCedulacion.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Publicar el ejecutable como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: CargadorOpenKM-Release
          path: |
            NewCargaOpenKmCedulacion/bin/Release/**
          if-no-files-found: error
